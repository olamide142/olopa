name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  oilc-tests:
    name: oilc tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run oilc tests
        run: cargo test --manifest-path oilc/Cargo.toml

  control-plane-tests:
    name: control plane tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/control_plane/requirements.txt

      - name: Install dependencies
        run: pip install -r app/control_plane/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # The compiler endpoint tests shell out to oilc; building it up front
      # keeps them off the per-request `cargo run` path.
      - name: Build oilc
        run: cargo build --release --manifest-path oilc/Cargo.toml

      - name: Run control plane tests
        working-directory: app/control_plane
        env:
          OILC_BINARY_PATH: ${{ github.workspace }}/oilc/target/release/oilc
        run: python -m pytest -q

      - name: Run Secure Connect gateway reconciler tests
        working-directory: app/secure_connect_gateway
        run: python -m pytest -q

  agent-tests:
    name: agent tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust nightly (for eBPF build.rs)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker --force

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run agent tests
        run: cargo test --manifest-path agent/Cargo.toml -p olopa

  ingest-server-tests:
    name: ingest server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run ingest server tests
        run: cargo test --manifest-path app/ingest_server/Cargo.toml

  e2e-runtime-to-ingest:
    name: e2e runtime->ingest
    runs-on: ubuntu-latest
    needs:
      - oilc-tests
      - agent-tests
      - ingest-server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust nightly (for eBPF build.rs)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker --force

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run ignored e2e integration test
        run: cargo test --manifest-path agent/Cargo.toml -p olopa agent::tests::e2e_rule_to_runtime_to_sender_to_ingest_runtime -- --ignored --exact
