name: Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (example: v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGENT_MANIFEST_PATH: agent/Cargo.toml
  AGENT_PACKAGE: olopa

jobs:
  build:
    name: Build Agent Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (nightly for bpf-linker)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> target

      - name: Install cross
        run: cargo install cross --locked

      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker --force

      - name: Prebuild eBPF object for cross
        run: |
          cargo +nightly build --release \
            --manifest-path agent/ebpf/Cargo.toml \
            -Z build-std=core \
            --target bpfel-unknown-none
          mkdir -p agent/ebpf/prebuilt
          cp agent/target/bpfel-unknown-none/release/olopa-ebpf-bin \
            agent/ebpf/prebuilt/olopa-ebpf-bin

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "${VERSION_INPUT}" ]; then
            VERSION="${VERSION_INPUT}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Build x86_64 musl
        run: |
          CARGO_TARGET_DIR=agent/target-cross/x86_64 cross build --release \
            --manifest-path "${AGENT_MANIFEST_PATH}" \
            -p "${AGENT_PACKAGE}" \
            --target x86_64-unknown-linux-musl

      - name: Build aarch64 musl
        run: |
          CARGO_TARGET_DIR=agent/target-cross/aarch64 cross build --release \
            --manifest-path "${AGENT_MANIFEST_PATH}" \
            -p "${AGENT_PACKAGE}" \
            --target aarch64-unknown-linux-musl

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="dist/${VERSION}"
          LATEST_DIR="dist/latest"

          mkdir -p "${RELEASE_DIR}" "${LATEST_DIR}"

          cp "agent/target-cross/x86_64/x86_64-unknown-linux-musl/release/olopa" \
            "${RELEASE_DIR}/olopa-agent-${VERSION}-x86_64-linux-musl"
          cp "agent/target-cross/aarch64/aarch64-unknown-linux-musl/release/olopa" \
            "${RELEASE_DIR}/olopa-agent-${VERSION}-aarch64-linux-musl"

          (cd "${RELEASE_DIR}" && sha256sum olopa-agent-* > checksums.txt)
          cp "app/control_plane/control_server/template/install.sh" "${RELEASE_DIR}/install.sh"
          if [ -f "app/control_plane/releases/latest/index.html" ]; then
            cp "app/control_plane/releases/latest/index.html" "${RELEASE_DIR}/index.html"
          fi
          printf '%s\n' "${VERSION}" > "${RELEASE_DIR}/version"

          cp "${RELEASE_DIR}/"* "${LATEST_DIR}/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(needs.build.outputs.version, 'v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.version }}
          files: dist/${{ needs.build.outputs.version }}/*
