name: Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (example: v0.1.0)"
        required: false
        type: string
      publish_storage:
        description: "Sync release artifacts to releases storage (S3/R2)"
        required: true
        default: true
        type: boolean
      update_latest:
        description: "Also overwrite latest/ with this release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGENT_MANIFEST_PATH: agent/Cargo.toml
  AGENT_PACKAGE: olopa

jobs:
  build:
    name: Build Agent Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (nightly for bpf-linker)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> target

      - name: Install cross
        run: cargo install cross --locked

      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker --force

      - name: Prebuild eBPF object for cross
        run: |
          cargo +nightly build --release \
            --manifest-path agent/ebpf/Cargo.toml \
            -Z build-std=core \
            --target bpfel-unknown-none
          mkdir -p agent/ebpf/prebuilt
          cp agent/target/bpfel-unknown-none/release/olopa-ebpf-bin \
            agent/ebpf/prebuilt/olopa-ebpf-bin

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "${VERSION_INPUT}" ]; then
            VERSION="${VERSION_INPUT}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Build x86_64 musl
        run: |
          CARGO_TARGET_DIR=agent/target-cross/x86_64 cross build --release \
            --manifest-path "${AGENT_MANIFEST_PATH}" \
            -p "${AGENT_PACKAGE}" \
            --target x86_64-unknown-linux-musl

      - name: Build aarch64 musl
        run: |
          CARGO_TARGET_DIR=agent/target-cross/aarch64 cross build --release \
            --manifest-path "${AGENT_MANIFEST_PATH}" \
            -p "${AGENT_PACKAGE}" \
            --target aarch64-unknown-linux-musl

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="dist/${VERSION}"
          LATEST_DIR="dist/latest"

          mkdir -p "${RELEASE_DIR}" "${LATEST_DIR}"

          cp "agent/target-cross/x86_64/x86_64-unknown-linux-musl/release/olopa" \
            "${RELEASE_DIR}/olopa-agent-${VERSION}-x86_64-linux-musl"
          cp "agent/target-cross/aarch64/aarch64-unknown-linux-musl/release/olopa" \
            "${RELEASE_DIR}/olopa-agent-${VERSION}-aarch64-linux-musl"

          (cd "${RELEASE_DIR}" && sha256sum olopa-agent-* > checksums.txt)
          cp "app/control_plane/control_server/template/install.sh" "${RELEASE_DIR}/install.sh"
          if [ -f "app/control_plane/releases/latest/index.html" ]; then
            cp "app/control_plane/releases/latest/index.html" "${RELEASE_DIR}/index.html"
          fi
          printf '%s\n' "${VERSION}" > "${RELEASE_DIR}/version"

          cp "${RELEASE_DIR}/"* "${LATEST_DIR}/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish-storage:
    name: Publish To releases.olopa.io Storage
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_storage == 'true')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Sync artifacts to S3/R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_AWS_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_AWS_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.RELEASES_AWS_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.RELEASES_AWS_REGION || vars.R2_AWS_REGION || 'us-east-1' }}
          RELEASES_BUCKET: ${{ vars.RELEASES_S3_BUCKET || vars.R2_BUCKET }}
          RELEASES_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT || vars.R2_ENDPOINT }}
          RELEASES_PREFIX: ${{ vars.RELEASES_S3_PREFIX || vars.R2_PREFIX || 'olopa' }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.build.outputs.version }}"
          SRC_DIR="dist/${VERSION}"
          [ -d "${SRC_DIR}" ] || { echo "::error::Missing build artifact directory: ${SRC_DIR}"; exit 1; }

          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::Missing access key secret."; exit 1; }
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || { echo "::error::Missing secret key secret."; exit 1; }
          [ -n "${RELEASES_BUCKET:-}" ] || { echo "::error::Missing bucket variable (RELEASES_S3_BUCKET or R2_BUCKET)."; exit 1; }

          PREFIX="${RELEASES_PREFIX#/}"
          PREFIX="${PREFIX%/}"
          if [ -n "${PREFIX}" ]; then
            BASE_URI="s3://${RELEASES_BUCKET}/${PREFIX}"
          else
            BASE_URI="s3://${RELEASES_BUCKET}"
          fi

          ENDPOINT_ARGS=()
          ENDPOINT="${RELEASES_ENDPOINT:-}"
          if [ -n "${ENDPOINT}" ]; then
            # Normalize endpoint value from repo vars:
            # - trim whitespace/newlines
            # - allow either host or full URL
            # - strip any accidental path suffix
            ENDPOINT="$(printf '%s' "${ENDPOINT}" | tr -d '\r\n' | xargs)"
            if [[ "${ENDPOINT}" != http://* && "${ENDPOINT}" != https://* ]]; then
              ENDPOINT="https://${ENDPOINT}"
            fi
            ENDPOINT_SCHEME="https"
            ENDPOINT_HOST="${ENDPOINT#http://}"
            if [[ "${ENDPOINT}" == https://* ]]; then
              ENDPOINT_HOST="${ENDPOINT#https://}"
            elif [[ "${ENDPOINT}" == http://* ]]; then
              ENDPOINT_SCHEME="http"
              ENDPOINT_HOST="${ENDPOINT#http://}"
            fi
            ENDPOINT_HOST="${ENDPOINT_HOST%%/*}"
            ENDPOINT="${ENDPOINT_SCHEME}://${ENDPOINT_HOST}"

            ENDPOINT_ARGS=(--endpoint-url "${ENDPOINT}" --region "${AWS_DEFAULT_REGION}")
            echo "Using custom S3 endpoint: ${ENDPOINT}"
          fi

          sync_release() {
            local endpoint_url="$1"
            local endpoint_region="$2"
            local endpoint_flags=()
            if [ -n "${endpoint_url}" ]; then
              endpoint_flags=(--endpoint-url "${endpoint_url}" --region "${endpoint_region}")
            fi

            echo "Syncing versioned release to ${BASE_URI}/${VERSION}/"
            aws "${endpoint_flags[@]}" s3 sync "${SRC_DIR}/" "${BASE_URI}/${VERSION}/" --delete

            UPDATE_LATEST="${{ github.event.inputs.update_latest }}"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              UPDATE_LATEST="true"
            fi
            if [ "${UPDATE_LATEST}" = "true" ]; then
              echo "Syncing latest release to ${BASE_URI}/latest/"
              aws "${endpoint_flags[@]}" s3 sync "${SRC_DIR}/" "${BASE_URI}/latest/" --delete
            else
              echo "Skipping latest/ sync (update_latest=false)."
            fi
          }

          if [ -n "${ENDPOINT:-}" ]; then
            if ! sync_release "${ENDPOINT}" "${AWS_DEFAULT_REGION}"; then
              ALT_ENDPOINT="${ENDPOINT_SCHEME}://${RELEASES_BUCKET}.${ENDPOINT_HOST}"
              echo "Primary endpoint failed; retrying with bucket-host endpoint: ${ALT_ENDPOINT}"
              sync_release "${ALT_ENDPOINT}" "${AWS_DEFAULT_REGION}"
            fi
          else
            sync_release "" "${AWS_DEFAULT_REGION}"
          fi

          echo "Storage publish completed."

  publish:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(needs.build.outputs.version, 'v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.version }}
          files: dist/${{ needs.build.outputs.version }}/*
