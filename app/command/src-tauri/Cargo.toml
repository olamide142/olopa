[package]
name = "olopa-command"
version = "0.1.0"
description = "Olopa Command — local security engineering and operations environment"
edition = "2021"
rust-version = "1.77"

# Standalone workspace: Command must not be pulled into the agent workspace,
# whose build script compiles the eBPF crate.
[workspace]

[lib]
name = "olopa_command_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# The OIL compiler is linked directly rather than shelled out to: its stdlib is
# embedded with include_str!, so Command carries a complete, self-contained
# compiler and shares the runtime-IR types the agent evaluates.
oilc = { path = "../../../oilc" }

[profile.release]
opt-level = "s"
lto = true
strip = true
