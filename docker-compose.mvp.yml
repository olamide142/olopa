services:
  olopa-ingest:
    environment:
      INGEST_PRODUCTION_MODE: "true"
      INGEST_API_TOKENS: "${OLOPA_MVP_INGEST_TOKEN:-olopa-local-ingest}"
      INGEST_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8100,http://localhost:8100"

  control-plane:
    environment:
      CONTROL_AUTH_REQUIRED: "true"
      CONTROL_DEV_TOKEN: "${OLOPA_MVP_CONTROL_TOKEN:-olopa-local-admin}"
      CONTROL_SC_WORKER_ENABLED: "false"
      RUST_INGEST_API_TOKEN: "${OLOPA_MVP_INGEST_TOKEN:-olopa-local-ingest}"
      OILC_BINARY_PATH: /opt/olopa/oilc/target/release/oilc
      DATABASE_URL: sqlite:////var/lib/olopa/control/control-plane.db
    volumes:
      - control_mvp_data:/var/lib/olopa/control

volumes:
  control_mvp_data:
