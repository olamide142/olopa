services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: olopa-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro

  surrealdb:
    image: surrealdb/surrealdb:v2.3.10
    container_name: olopa-surrealdb
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - file:/data/olopa.db
    ports:
      - "8001:8000"
    volumes:
      - surreal_data:/data

  redis:
    image: redis:7-alpine
    container_name: olopa-redis
    volumes:
      - redis_data:/data

  olopa-ingest:
    build:
      context: ./app/ingest_server
      dockerfile: Dockerfile
    container_name: olopa-ingest
    depends_on:
      - clickhouse
      - surrealdb
      - redis
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      INGEST_PERSIST_JSONL_PATH: /var/lib/olopa/ingest/events.jsonl
      INGEST_CLICKHOUSE_URL: http://clickhouse:8123/
      INGEST_CLICKHOUSE_INSERT_SQL: INSERT INTO olopa.events_raw FORMAT JSONEachRow
      INGEST_SURREAL_URL: http://surrealdb:8000/sql
      INGEST_SURREAL_NAMESPACE: olopa
      INGEST_SURREAL_DATABASE: events
      INGEST_SURREAL_TABLE: events_raw
      INGEST_SURREAL_USER: root
      INGEST_SURREAL_PASSWORD: root
      OLOPA_INTEL_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ingest_data:/var/lib/olopa/ingest

  control-plane:
    image: olopa-control-plane:local
    build:
      context: .
      dockerfile: app/control_plane/Dockerfile
    container_name: olopa-control-plane
    depends_on:
      - olopa-ingest
    environment:
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: "8100"
      RUST_INGEST_BASE_URL: http://olopa-ingest:8000
      OILC_MANIFEST_PATH: /opt/olopa/oilc/Cargo.toml
    ports:
      - "8100:8100"
    volumes:
      - ./oilc:/opt/olopa/oilc:ro

  # Threat-intel feed sync, decoupled from the control-plane process
  # lifetime (previously an in-process background thread started on
  # control-plane boot). Reuses the control-plane image, which already has
  # app/intel_sync copied in and its dependencies installed — run
  # `docker compose build control-plane` first if this image doesn't exist
  # yet locally.
  olopa-intel-sync:
    image: olopa-control-plane:local
    container_name: olopa-intel-sync
    depends_on:
      - redis
    environment:
      OLOPA_INTEL_REDIS_URL: redis://redis:6379/0
      OLOPA_INTEL_PATH: /var/lib/olopa/intel/intel.json
    volumes:
      - intel_data:/var/lib/olopa/intel
    command: ["/opt/venv/bin/python", "-m", "app.intel_sync.sync", "--loop"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    container_name: olopa-keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev

  caddy:
    image: caddy:2.8-alpine
    container_name: olopa-caddy
    network_mode: host
    depends_on:
      - control-plane
      - olopa-ingest
      - keycloak
    environment:
      PORT: "80"
    volumes:
      - ./app/control_plane/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app/control_plane/site:/srv/site:ro

volumes:
  clickhouse_data:
  surreal_data:
  ingest_data:
  redis_data:
  intel_data:
